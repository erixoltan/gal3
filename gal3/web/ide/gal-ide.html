<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gal ide</title>
<style>
/* gal ide — same family as the playground: cool grounds, teal accent,
   amber reserved for run. Mono-forward identity. */
:root {
  --paper: #f4f6f8; --pane: #ffffff; --ink: #22272e; --muted: #5b6672;
  --line: #d7dde3; --accent: #0f766e; --accent-ink: #ffffff;
  --run: #b45309; --run-ink: #ffffff; --fail: #b3352b; --chip: #e8ecef;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14181c; --pane: #1b2127; --ink: #d6dde3; --muted: #8b97a3;
    --line: #2c343d; --accent: #2dd4bf; --accent-ink: #0c2b27;
    --run: #f5a524; --run-ink: #2b1c03; --fail: #f0776d; --chip: #242c34;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.mono { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; }
.spacer { flex: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- toolbar ---- */
#toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  padding-top: calc(6px + env(safe-area-inset-top));
  border-bottom: 1px solid var(--line);
  background: var(--pane);
  flex: none;
}
.icon-btn {
  background: none; border: 1px solid transparent; border-radius: 4px;
  color: var(--ink); font-size: 18px; line-height: 1;
  padding: 6px 9px; cursor: pointer;
}
.icon-btn:hover { background: var(--chip); }
.icon-btn:focus-visible, .act:focus-visible, .stage-tab:focus-visible, .drawer-item:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
#filename { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
#filename.dirty::after { content: " •"; color: var(--accent); }
#target {
  background: var(--chip); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 6px; font: inherit; font-size: 13px;
}
.act {
  font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  font-size: 13px; padding: 6px 14px; border-radius: 4px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  cursor: pointer;
}
.act.run { border-color: var(--run); background: var(--run); color: var(--run-ink); }
.act.stop { border-color: var(--fail); background: var(--fail); color: #fff; }
.act:disabled { opacity: 0.45; cursor: default; }

/* ---- menu dropdown ---- */
#drawer {
  position: fixed; z-index: 30;
  min-width: 200px; max-width: 80vw;
  background: var(--pane); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
  padding: 6px;
  display: flex; flex-direction: column; gap: 2px;
}
#drawer[hidden] { display: none; }
#scrim { position: fixed; inset: 0; z-index: 20; background: transparent; }
#scrim[hidden] { display: none; }
.drawer-item {
  text-align: left; background: none; border: 0; border-radius: 4px;
  color: var(--ink); font: inherit; font-size: 15px;
  padding: 10px 12px; cursor: pointer;
}
.drawer-item:hover { background: var(--chip); }
.drawer-sep { border-top: 1px solid var(--line); margin: 8px 4px; }
.drawer-note { color: var(--muted); font-size: 12.5px; padding: 4px 12px; line-height: 1.6; }

/* ---- split: editor + output ---- */
#split { flex: 1; display: grid; min-height: 0; gap: 0; }
@media (orientation: landscape) {
  #split { grid-template-columns: 1fr minmax(220px, 38%); }
  #output-panel { border-left: 1px solid var(--line); }
  body.output-hidden #split { grid-template-columns: 1fr; }
}
@media (orientation: portrait) {
  #split { grid-template-rows: 1fr minmax(140px, 32%); }
  #output-panel { border-top: 1px solid var(--line); }
  body.output-hidden #split { grid-template-rows: 1fr; }
}
body.output-hidden #output-panel { display: none; }

/* ---- editor panel ---- */
#editor-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#editor-host { flex: 1; min-height: 0; position: relative; }
#source-host, #stage-host { position: absolute; inset: 0; }
.cm-editor { height: 100%; font-size: 13.5px; }
.cm-editor.cm-focused { outline: none; }
.cm-scroller { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; }

#stage-tabs {
  display: flex; gap: 4px; padding: 5px 8px;
  padding-bottom: calc(5px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); background: var(--pane);
  overflow-x: auto; flex: none;
}
.stage-tab {
  font-size: 12.5px; padding: 4px 12px;
  border: 1px solid var(--line); border-radius: 3px;
  background: var(--chip); color: var(--muted); cursor: pointer;
  white-space: nowrap;
}
.stage-tab[data-on="1"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stage-tab:disabled { opacity: 0.4; cursor: default; }
.stage-tab.failed { border-color: var(--fail); color: var(--fail); }

/* ---- output panel ---- */
#output-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--pane); }
#output-head {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 10px; border-bottom: 1px solid var(--line);
  color: var(--muted); font-size: 12.5px; flex: none;
}
#output {
  flex: 1; margin: 0; padding: 10px 12px; overflow: auto;
  font-size: 12.5px; line-height: 1.5; white-space: pre-wrap;
}
#output .err { color: var(--fail); }
#output .dim { color: var(--muted); }

/* ---- modal (sign-in, server files) ---- */
#modal-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.35); }
#modal-scrim[hidden] { display: none; }
#modal {
  position: fixed; z-index: 50;
  top: 18vh; left: 50%; transform: translateX(-50%);
  width: min(340px, 92vw);
  background: var(--pane); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.25);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
#modal[hidden] { display: none; }
#modal h2 { margin: 0; font-size: 15px; font-weight: 600; }
#modal input {
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px;
  padding: 8px 10px; font: inherit; font-size: 14px; width: 100%;
}
#modal .modal-row { display: flex; gap: 8px; justify-content: flex-end; }
#modal .modal-err { color: var(--fail); font-size: 13px; min-height: 1em; }
#modal .file-list { max-height: 44vh; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
#modal .file-item {
  text-align: left; background: none; border: 0; border-radius: 4px;
  color: var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 13px; padding: 8px 10px; cursor: pointer;
  display: flex; justify-content: space-between; gap: 10px;
}
#modal .file-item:hover { background: var(--chip); }
#modal .file-item .dim { color: var(--muted); }
#modal .plain {
  background: var(--chip); border: 1px solid var(--line); color: var(--ink);
}

/* phone: tighten the toolbar */
@media (max-width: 560px) {
  #filename { display: none; }
  .act { padding: 6px 11px; }
  #toolbar { gap: 6px; }
}

</style>
</head>
<body>

<header id="toolbar">
  <button id="menu-btn" class="icon-btn" aria-label="menu" aria-expanded="false">&#9776;</button>
  <span id="filename" class="mono" title="current file">untitled.gal</span>
  <span class="spacer"></span>
  <label class="sr-only" for="target">output language</label>
  <select id="target" title="output language">
    <option value="python">python</option>
    <option value="javascript" selected>javascript</option>
    <option value="browser">browser js</option>
  </select>
  <button id="compile" class="act">compile</button>
  <button id="run" class="act run" disabled>run</button>
  <button id="stop" class="act stop" hidden>stop</button>
  <button id="out-toggle" class="icon-btn" aria-label="toggle output panel" title="toggle output panel">&#9707;</button>
</header>

<nav id="drawer" hidden>
  <button class="drawer-item" id="m-new">new</button>
  <button class="drawer-item" id="m-open">open&#8230;</button>
  <button class="drawer-item" id="m-save">save</button>
  <button class="drawer-item" id="m-saveas">save as&#8230;</button>
  <div class="drawer-sep"></div>
  <button class="drawer-item" id="m-signin">sign in&#8230;</button>
  <button class="drawer-item" id="m-signout" hidden>sign out</button>
  <div class="drawer-sep"></div>
  <div class="drawer-note" id="drawer-status">gal ide 3.1.1<br>the compiler runs in this page.<br><span class="mono">ctrl+enter</span> compile &#183; <span class="mono">ctrl+s</span> save</div>
</nav>
<div id="modal-scrim" hidden></div>
<div id="modal" role="dialog" aria-modal="true" hidden></div>
<div id="scrim" hidden></div>

<main id="split">
  <section id="editor-panel">
    <div id="editor-host">
      <div id="source-host"></div>
      <div id="stage-host" hidden></div>
    </div>
    <nav id="stage-tabs" aria-label="pipeline stages">
      <button class="stage-tab mono" data-stage="source" data-on="1">source</button>
      <button class="stage-tab mono" data-stage="gal" disabled>gal</button>
      <button class="stage-tab mono" data-stage="atomic" disabled>atomic</button>
      <button class="stage-tab mono" data-stage="target" disabled id="target-tab">javascript</button>
    </nav>
  </section>
  <section id="output-panel">
    <div id="output-head">
      <span class="mono" id="output-title">output</span>
      <span class="spacer"></span>
      <button id="out-close" class="icon-btn" aria-label="hide output">&#215;</button>
    </div>
    <pre id="output" class="mono"></pre>
  </section>
</main>

// *************************************************************************************
// * data type inference: definitional and contextual types for every language element *
// *************************************************************************************
// 
// Ported from gal2’s Data_Types.gal and extended, per the design note in
// docs/data_type_inference.md. Every element can carry two properties:
// 
// Data_Type is definitional - what the element is. A quote token is a
// string, an addition is a number, a variable is whatever its declaration
// says. Usage is contextual - what the surrounding element applies to it:
// every argument of a say statement is used as a string, the condition of
// an if is used as a flag. When the two differ, a strongly typed generator
// converts; gal itself does not enforce agreement, so a mismatch is the
// generator’s decision, not an error.
// 
// Result types are declarative wherever possible: the dialect declarations
// carry a Data_Type property (the Syntax_True pattern, the same mechanism
// that carries operator precedence), so an operation’s instances default to
// their result type without a handler here. Contextual usage is also mostly
// declarative: the argument declarations in the dialect already state the
// type each statement imposes on each argument, and Declared_Usage below
// stamps those expectations onto the actual arguments through the class
// registry. Handlers are only written where something is not declarable:
// variadic argument lists, declaration statements typing their names, and
// literal tokens.
// 
// Variable references resolve through the contexts Infer_Variables
// populates: declarations and parameters register their names and types in
// the enclosing variable context (the Get_Module pattern - an element asks
// its parent, and scoping elements such as methods return themselves), and
// word tokens look themselves up through that chain.
// 
// inference Data_Types
// variadic statements: every argument is used as a string
// declaration statements type their names definitionally
// ported from the gal2 inference
// END inference Data_Types

        }
        ok.onclick = submit;
        input.onkeydown = function (e) { if (e.key === "Enter") submit(); if (e.key === "Escape") close(null, false); };
        row.appendChild(cancel); row.appendChild(ok);
        m.appendChild(h); m.appendChild(input); m.appendChild(err); m.appendChild(row);
        input.focus(); input.select();
    });
}
function pickServerFile(files) {
    return openModal(function (m, close) {
        var h = document.createElement("h2"); h.textContent = "your files";
        m.appendChild(h);
        var list = document.createElement("div"); list.className = "file-list";
        if (!files.length) {
            var none = document.createElement("div"); none.className = "modal-err";
            none.textContent = "no files yet - save one first.";
            m.appendChild(none);
        }
        files.forEach(function (f) {
            var b = document.createElement("button"); b.className = "file-item";
            var n = document.createElement("span"); n.textContent = f.Name;
            var sz = document.createElement("span"); sz.className = "dim"; sz.textContent = f.Size + " b";
            b.appendChild(n); b.appendChild(sz);
            b.onclick = function () { close(f.Name, true); };
            list.appendChild(b);
        });
        m.appendChild(list);
        var row = document.createElement("div"); row.className = "modal-row";
        var cancel = document.createElement("button"); cancel.className = "act plain"; cancel.textContent = "cancel";
        cancel.onclick = function () { close(null, false); };
        row.appendChild(cancel);
        m.appendChild(row);
    });
}
function signInDialog() {
    return openModal(function (m, close) {
        var h = document.createElement("h2"); h.textContent = "sign in";
        var user = document.createElement("input"); user.placeholder = "user"; user.autocapitalize = "none";
        var pass = document.createElement("input"); pass.placeholder = "password"; pass.type = "password";
        var err = document.createElement("div"); err.className = "modal-err";
        var row = document.createElement("div"); row.className = "modal-row";
        var cancel = document.createElement("button"); cancel.className = "act plain"; cancel.textContent = "cancel";
        var ok = document.createElement("button"); ok.className = "act"; ok.textContent = "sign in";
        cancel.onclick = function () { close(null, false); };
        function submit() {
            apiFetch("/api/login", { method: "POST", body: JSON.stringify({ User: user.value.trim(), Password: pass.value }) })
                .then(function (r) {
                    if (r.status === 200) { close(r.body.User, true); }
                    else { err.textContent = (r.body && r.body.Error) || "sign in failed"; }
                })
                .catch(function () { err.textContent = "no server here - open the ide from the gal site to use server files."; });
        }
        ok.onclick = submit;
        pass.onkeydown = function (e) { if (e.key === "Enter") submit(); };
        row.appendChild(cancel); row.appendChild(ok);
        m.appendChild(h); m.appendChild(user); m.appendChild(pass); m.appendChild(err); m.appendChild(row);
        user.focus();
    });
}
$("m-signin").addEventListener("click", function () {
    toggleDrawer(false);
    signInDialog().then(function (user) { setSignedIn(user); }).catch(function () {});
});
$("m-signout").addEventListener("click", function () {
    toggleDrawer(false);
    apiFetch("/api/logout", { method: "POST" }).catch(function () {}).then(function () { setSignedIn(null); });
});
/* boot-time session probe: only meaningful when served from the site */
apiFetch("/api/session").then(function (r) {
    if (r.status === 200 && r.body && r.body.User) setSignedIn(r.body.User);
}).catch(function () {});

var current = { name: "untitled.gal", handle: null, savedText: "" };
function setDirtyUi() {
    var dirty = sourceText() !== current.savedText;
    $("filename").textContent = current.name;
    $("filename").classList.toggle("dirty", dirty);
    return dirty;
}
function loadIntoEditor(name, text, handle, savedText) {
    current = { name: name, handle: handle, savedText: savedText };
    sourceView.setState(CM.EditorState.create({
        doc: text,
        extensions: [
            CM.basicSetup, CM.galLanguage,
            CM.keymap.of([
                CM.indentWithTab,
                { key: "Mod-Enter", run: function () { compile(); return true; } },
                { key: "Mod-s", run: function () { save(); return true; }, preventDefault: true },
            ]),
            themeCompartment.of(darkMedia.matches ? CM.oneDark : []),
            CM.EditorView.updateListener.of(function (u) { if (u.docChanged) onSourceEdited(); }),
        ],
    }));
    invalidateStages();
    selectTab("source");
    setDirtyUi();
}
function newFile() {
    if (setDirtyUi() && !window.confirm("discard unsaved changes?")) return;
    loadIntoEditor("untitled.gal", "", null, "");
    localStorage.removeItem(AUTOSAVE_KEY);
    clearLog();
}
function openFile() {
    if (setDirtyUi() && !window.confirm("discard unsaved changes?")) return;
    provider.open().then(function (f) {
        loadIntoEditor(f.name, f.text, f.handle, f.text);
    }).catch(function () {});
}
function save() {
    var file = { name: current.name, text: sourceText(), handle: current.handle };
    provider.save(file).then(function (f) {
        current.name = f.name; current.handle = f.handle; current.savedText = f.text;
        setDirtyUi();
    }).catch(function () {});
}
function saveAs() {
    var file = { name: current.name, text: sourceText(), handle: null };
    provider.saveAs(file).then(function (f) {
        current.name = f.name; current.handle = f.handle; current.savedText = f.text;
        setDirtyUi();
    }).catch(function () {});
}

/* autosave: the editor never loses work between visits */
var AUTOSAVE_KEY = "gal-ide:autosave";
var autosaveTimer = null;
function onSourceEdited() {
    invalidateStages();
    setDirtyUi();
    if (autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(function () {
        try {
            localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ name: current.name, text: sourceText() }));
        } catch (e) {}
    }, 400);
}
window.addEventListener("beforeunload", function (e) {
    if (setDirtyUi()) { e.preventDefault(); e.returnValue = ""; }
});

/* ---------------- drawer ---------------- */
function toggleDrawer(open) {
    var d = $("drawer");
    var show = open !== undefined ? open : d.hidden;
    if (show) {
        var r = $("menu-btn").getBoundingClientRect();
        d.style.top = (r.bottom + 4) + "px";
        d.style.left = Math.max(6, r.left) + "px";
    }
    d.hidden = !show;
    $("scrim").hidden = !show;
    $("menu-btn").setAttribute("aria-expanded", show ? "true" : "false");
}
window.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("drawer").hidden) toggleDrawer(false);
});
$("menu-btn").addEventListener("click", function () { toggleDrawer(); });
$("scrim").addEventListener("click", function () { toggleDrawer(false); });
$("m-new").addEventListener("click", function () { toggleDrawer(false); newFile(); });
$("m-open").addEventListener("click", function () { toggleDrawer(false); openFile(); });
$("m-save").addEventListener("click", function () { toggleDrawer(false); save(); });
$("m-saveas").addEventListener("click", function () { toggleDrawer(false); saveAs(); });

/* ---------------- boot ---------------- */
spawnWorker();
showOutput(false);
var restored = null;
try { restored = JSON.parse(localStorage.getItem(AUTOSAVE_KEY) || "null"); } catch (e) {}
if (restored && restored.text) {
    loadIntoEditor(restored.name || "untitled.gal", restored.text, null, "");
    setDirtyUi();
} else {
    loadIntoEditor("untitled.gal", "", null, "");
}
$("target-tab").textContent = $("target").selectedOptions[0].textContent;
})();

</script>
</body>
